version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: laravel_app
    restart: always
    working_dir: /var/www
    environment:
      APP_ENV: production
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      # PENTING: Agar file upload (storage) tidak hilang saat restart
      - ./storage/app:/var/www/storage/app
      - ./storage/framework:/var/www/storage/framework
      - ./storage/logs:/var/www/storage/logs
    depends_on:
      - db
    networks:
      - laravel_net

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      # Mapping file config nginx kamu
      - ./nginx/conf.d:/etc/nginx/conf.d
      # Mapping public folder agar Nginx bisa serve file static (css/js/images)
      - ./public:/var/www/public
      - ./storage/app/public:/var/www/storage/app/public
    depends_on:
      - app
    networks:
      - laravel_net

  db:
    image: postgres:17
    container_name: laravel_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - laravel_net

networks:
  laravel_net:
    driver: bridge

volumes:
  db_data: